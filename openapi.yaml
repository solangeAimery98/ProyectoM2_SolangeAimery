openapi: 3.1.1

info:
  title: MiniBlog API
  version: 1.0.0
  description: REST API for managing blog authors and posts.
  contact:
    name: Solange Aimery
    email: solangeaimery@icloud.com

servers:
  - url: http://localhost:3000
    description: Local development

  - url: https://proyectom2solangeaimery-production.up.railway.app/
    description: Production server

tags:
  - name: Authors
    description: Endpoints for managing authors

  - name: Posts
    description: Endpoints for managing posts

paths:
  /authors:
    get:
      tags:
        - Authors
      summary: Get all authors
      description: Returns the complete list of authors stored in the database.

      responses:
        "200":
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Author"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Authors
      summary: Create a new author
      description: Creates a new author using the information provided in the request body.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAuthor"

      responses:
        "201":
          description: Author created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"

        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /authors/{id}:
    get:
      tags:
        - Authors
      summary: Get an author by ID
      description: Retrieves an author using its unique identifier.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Author found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"

        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - Authors
      summary: Update an author
      description: Updates the information of an existing author.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAuthor"

      responses:
        "200":
          description: Author updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"

        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - Authors
      summary: Delete an author
      description: Deletes an author using its unique identifier.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "204":
          description: Author deleted successfully

        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts:
    get:
      tags:
        - Posts
      summary: Get all posts
      description: Returns the complete list of posts.

      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Posts
      summary: Create a new post
      description: Creates a new post for an existing author.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPost"

      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Get a post by ID
      description: Retrieves a post using its unique identifier.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - Posts
      summary: Update a post
      description: Updates an existing post.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPost"

      responses:
        "200":
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - Posts
      summary: Delete a post
      description: Deletes a post using its unique identifier.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "204":
          description: Post deleted successfully

        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/author/{authorId}:
    get:
      tags:
        - Posts
      summary: Get posts by author
      description: Returns all posts created by a specific author.

      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: List of author's posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Author:
      type: object

      properties:
        id:
          type: integer
          description: Unique author ID

        name:
          type: string
          description: Author's full name

        email:
          type: string
          format: email
          description: Author's email address

        bio:
          type: string
          description: Author biography

    NewAuthor:
      type: object

      required:
        - name
        - email
        - bio

      properties:
        name:
          type: string
          description: Author's full name

        email:
          type: string
          format: email
          description: Unique author email

        bio:
          type: string
          description: Author biography

    Post:
      type: object

      properties:
        id:
          type: integer
          description: Unique post ID

        title:
          type: string
          description: Post title

        content:
          type: string
          description: Post content

        author_id:
          type: integer
          description: ID of the post author

    NewPost:
      type: object

      required:
        - title
        - content
        - author_id

      properties:
        title:
          type: string
          description: Post title

        content:
          type: string
          description: Post content

        author_id:
          type: integer
          description: Author ID

    Error:
      type: object

      properties:
        error:
          type: string
          description: Descriptive error messageopenapi: 3.1.1

